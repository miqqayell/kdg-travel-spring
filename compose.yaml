# Local PostgreSQL for the dev profile. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integration4
      POSTGRES_USER: spring
      POSTGRES_PASSWORD: spring
    ports:
      - "5435:5432"
    volumes:
      - kdg-travel-data:/var/lib/postgresql/data

volumes:
  kdg-travel-data:
