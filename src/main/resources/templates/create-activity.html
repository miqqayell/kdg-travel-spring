<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event - KdG Travel</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
  <style>
    .nav-link.active { color: #20c997 !important; background-color: rgba(32, 201, 151, 0.15); border-radius: 8px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-glass sticky-top py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/activities">
      <img th:src="@{/images/logo.png}" alt="Logo" width="40" height="40" class="rounded-3 shadow-sm" style="object-fit: cover;">
      <span class="text-white tracking-wide">KDG Travel</span>
    </a>
    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-3 fw-medium" id="nav-links">
        <li class="nav-item"><a class="nav-link text-white-50" href="/activities" id="nav-activities"><i class="bi bi-compass me-1"></i> Explore</a></li>
        <li class="nav-item"><a class="nav-link text-white-50" href="/map" id="nav-map"><i class="bi bi-map me-1"></i> Map</a></li>
        <li class="nav-item"><a class="nav-link text-white-50" href="/travel-groups" id="nav-travel-groups"><i class="bi bi-people me-1"></i> Groups</a></li>
        <li class="nav-item"><a class="nav-link text-white-50" href="/users" id="nav-users"><i class="bi bi-search me-1"></i> Users</a></li>
        <li class="nav-item"><a class="nav-link text-white-50" href="/analytics" id="nav-analytics"><i class="bi bi-bar-chart me-1"></i> Analytics</a></li>
        <li class="nav-item" th:if="${canAccessAdminDashboard}"><a class="nav-link text-white-50" href="/admin" id="nav-admin"><i class="bi bi-shield-lock me-1"></i> Admin</a></li>
      </ul>
      <div class="d-flex align-items-center gap-4">
        <div class="dropdown">
          <a href="#" class="text-white position-relative text-decoration-none fs-5 hover-scale" id="notification-bell" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-bell"></i>
            <span id="notification-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none; font-size: 0.6rem;">0</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-3 rounded-4" id="notification-list" style="max-height: 400px; overflow-y: auto; min-width: 320px; background-color: var(--surface-dark);">
            <li><span class="dropdown-item text-muted small py-3 text-center bg-transparent">No new notifications</span></li>
          </ul>
        </div>
        <a href="/profile" class="btn btn-primary rounded-pill px-4 fw-bold text-truncate" style="max-width: 150px;" th:text="${userName != null ? userName : 'My Profile'}">My Profile</a>
      </div>
    </div>
  </div>
</nav>

<div class="container py-5 animate-fade-in-up">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-secondary border-opacity-25 rounded-4 bg-dark">
        <div class="card-header bg-transparent border-bottom border-secondary border-opacity-25 pt-4 pb-3">
          <h3 class="fw-bold text-success mb-0"><i class="bi bi-calendar-plus me-2"></i> Create New Event</h3>
        </div>
        <div class="card-body p-4 p-md-5">
          <form id="activityForm" th:action="${formAction}" th:object="${activity}" method="post">

            <div class="mb-4">
              <label class="form-label fw-bold text-white">Event Title</label>
              <input type="text" class="form-control bg-transparent text-white border-secondary shadow-none" th:field="*{title}" required>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-white">Type</label>
              <select class="form-select bg-dark text-white border-secondary shadow-none" th:field="*{type}">
                <option value="Entertainment">Entertainment</option>
                <option value="Sports & Outdoors">Sports & Outdoors</option>
                <option value="Academic">Academic</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-white">Address / Location (in Antwerp)</label>
              <div class="position-relative">
                <input type="text" class="form-control bg-transparent text-white border-secondary shadow-none" id="locationInput" th:field="*{locationAddress}" placeholder="e.g. Groenplaats, Antwerp" autocomplete="off" required>
                <ul id="suggestionsList" class="list-group position-absolute w-100 dropdown-shadow rounded-3 overflow-hidden mt-1" style="z-index: 1050; display: none; max-height: 250px; overflow-y: auto; top: 100%;">
                </ul>
              </div>
              <small class="text-muted">Start typing to see suggestions in Antwerp!</small>
            </div>

            <input type="hidden" id="latInput" th:field="*{locationLatitude}">
            <input type="hidden" id="lngInput" th:field="*{locationLongitude}">

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="startTime" class="form-label fw-bold text-white">Start Time</label>
                <input type="datetime-local"
                       class="form-control bg-transparent text-white border-secondary shadow-none"
                       id="startTime" name="startTime"
                       th:value="${activity.startTime != null ? #temporals.format(activity.startTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
              </div>
              <div class="col-md-6">
                <label for="endTime" class="form-label fw-bold text-white">End Time</label>
                <input type="datetime-local"
                       class="form-control bg-transparent text-white border-secondary shadow-none"
                       id="endTime" name="endTime"
                       th:value="${activity.endTime != null ? #temporals.format(activity.endTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-white">Event Image URL (Optional)</label>
              <input type="url" class="form-control bg-transparent text-white border-secondary shadow-none" th:field="*{imageUrl}" placeholder="https://example.com/my-event-image.jpg">
              <small class="text-muted">Paste a link to an image to make your event stand out!</small>
            </div>

            <div class="mb-5">
              <label class="form-label fw-bold text-white">Description</label>
              <textarea class="form-control bg-transparent text-white border-secondary shadow-none" rows="4" th:field="*{description}"></textarea>
            </div>

            <div class="d-flex justify-content-between flex-wrap gap-2">
              <a href="/activities" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
              <button id="submitBtn" type="submit" class="btn btn-success rounded-pill px-5 fw-bold" th:text="${submitLabel ?: 'Save'}">Save</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  document.addEventListener("DOMContentLoaded", function() {
    // Navbar Active Link Highlighting
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('#nav-links .nav-link');
    navLinks.forEach(link => {
      if (currentPath.startsWith(link.getAttribute('href')) && link.getAttribute('href') !== '/') {
        link.classList.remove('text-white-50');
        link.classList.add('active');
      }
    });

    // --- Global Notification System ---
    fetch('/api/notifications')
            .then(response => response.json())
            .then(data => {
              const bellIcon = document.getElementById('notification-bell');
              const badge = document.getElementById('notification-badge');
              const list = document.getElementById('notification-list');

              const unreadCount = data.filter(note => !note.read).length;

              if (data.length > 0) {
                list.innerHTML = '';
                if (unreadCount > 0) {
                  badge.style.display = 'inline-block';
                  badge.innerText = unreadCount;
                }

                const recentNotifications = data.slice(0, 5);
                recentNotifications.forEach(note => {
                  const date = new Date(note.createdAt).toLocaleDateString();
                  let link = '#';
                  if ((note.notificationType === 'ACTIVITY_UPDATE' || note.notificationType === 'ACTIVITY_INVITE' || note.notificationType === 'BUDDY_MATCH') && note.referenceId) link = '/activities/' + note.referenceId;
                  else if (note.notificationType === 'GROUP_JOIN' && note.referenceId) link = '/travel-groups/' + note.referenceId;
                  else if (note.notificationType === 'FRIEND_REQUEST') link = '/users';

                  const bgClass = note.read ? '' : 'bg-primary bg-opacity-10';
                  list.innerHTML += `
                        <li>
                            <a class="dropdown-item py-3 border-bottom border-secondary border-opacity-25 ${bgClass}" href="${link}">
                                <div class="fw-bold text-primary mb-1" style="font-size: 0.9rem;">
                                    <i class="bi bi-info-circle me-1"></i> ${note.title}
                                </div>
                                <div class="text-muted small text-wrap" style="width: 250px; line-height: 1.4;">${note.description}</div>
                                <div class="text-muted" style="font-size: 0.75rem; margin-top: 6px;">${date}</div>
                            </a>
                        </li>`;
                });

                if (data.length > 5) {
                  list.innerHTML += `<li><a class="dropdown-item text-center text-primary py-2 small fw-bold" href="#">View all ${data.length} notifications</a></li>`;
                }
              }

              const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
              const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || /*[[${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}]]*/ 'X-CSRF-TOKEN';

              if (bellIcon) {
                bellIcon.addEventListener('click', () => {
                  if (unreadCount > 0) {
                    fetch('/api/notifications/mark-read', {
                      method: 'POST',
                      headers: { [csrfHeader]: csrfToken }
                    });
                    badge.style.display = 'none';
                    document.querySelectorAll('.bg-opacity-10').forEach(el => el.classList.remove('bg-primary', 'bg-opacity-10'));
                  }
                });
              }
            })
            .catch(error => console.error("Error fetching notifications:", error));
  });

  // Location Auto-complete Logic
  const locationInput = document.getElementById('locationInput');
  const suggestionsList = document.getElementById('suggestionsList');
  const latInput = document.getElementById('latInput');
  const lngInput = document.getElementById('lngInput');
  let debounceTimer;

  locationInput.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    const query = this.value.trim();
    if (query.length < 2) {
      suggestionsList.style.display = 'none';
      return;
    }

    debounceTimer = setTimeout(() => {
      fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=51.2194&lon=4.4025&limit=5`)
              .then(response => response.json())
              .then(data => {
                suggestionsList.innerHTML = '';
                if (data.features && data.features.length > 0) {
                  suggestionsList.style.display = 'block';
                  data.features.forEach(feature => {
                    const place = feature.properties;
                    let displayName = place.name || place.street || "";
                    if (place.housenumber) displayName += " " + place.housenumber;
                    if (place.city || place.state) displayName += ", " + (place.city || place.state);
                    if (!displayName.includes("Belgium") && place.country) displayName += ", " + place.country;

                    const li = document.createElement('li');
                    li.className = 'list-group-item custom-suggestion-item py-2 px-3';
                    li.innerHTML = `<div class="d-flex align-items-center"><i class="bi bi-geo-alt-fill text-success fs-5 me-3"></i><span class="fw-medium">${displayName}</span></div>`;
                    li.addEventListener('click', () => {
                      locationInput.value = displayName;
                      latInput.value = feature.geometry.coordinates[1];
                      lngInput.value = feature.geometry.coordinates[0];
                      suggestionsList.style.display = 'none';
                    });
                    suggestionsList.appendChild(li);
                  });
                } else {
                  suggestionsList.style.display = 'none';
                }
              })
              .catch(err => console.error("Geocoding error:", err));
    }, 300);
  });

  document.addEventListener('click', function(e) {
    if (e.target !== locationInput && e.target !== suggestionsList) {
      suggestionsList.style.display = 'none';
    }
  });

  // Form Submission Interceptor
  document.getElementById('activityForm').addEventListener('submit', function(event) {
    if (latInput.value && lngInput.value) {
      return;
    }
    event.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Locating...';
    submitBtn.disabled = true;
    const address = locationInput.value;

    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(address)}&lat=51.2194&lon=4.4025&limit=1`)
            .then(response => response.json())
            .then(data => {
              if (data.features && data.features.length > 0) {
                latInput.value = data.features[0].geometry.coordinates[1];
                lngInput.value = data.features[0].geometry.coordinates[0];
                this.submit();
              } else {
                alert("We couldn't accurately map that address. Please select one from the dropdown suggestions!");
                submitBtn.innerHTML = 'Save';
                submitBtn.disabled = false;
              }
            });
  });
</script>
</body>
</html>
