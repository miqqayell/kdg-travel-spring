<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - KDG Travel</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.15), transparent 40%),
            radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.15), transparent 40%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: rgba(30, 41, 59, 0.7) !important;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        /* Custom Google Button Styling */
        .btn-google {
            background-color: white;
            color: #3f3f3f;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-google:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,255,255,0.15);
        }
    </style>
</head>
<body class="overflow-hidden">

<div class="login-wrapper animate-fade-in-up">
    <div class="card login-card p-4 p-md-5 rounded-4 shadow-lg text-center">

        <div class="mb-5">
            <img th:src="@{/images/logo.png}" alt="Logo" width="70" height="70" class="rounded-4 shadow-sm mb-4" style="object-fit: cover;">
            <h3 class="fw-bold tracking-tight text-white mb-2">Welcome to KDG Travel</h3>
            <p class="text-muted small">Connect with fellow students and explore the world together.</p>
        </div>

        <div th:if="${param.logout}" class="alert alert-success bg-success bg-opacity-10 border-success border-opacity-25 text-success py-2 small rounded-3 mb-4">
            You have been securely logged out.
        </div>

        <div th:if="${param.banned}" class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-danger py-2 small rounded-3 mb-4">
            Your account has been banned.
        </div>

        <div th:if="${param.suspended}" class="alert alert-warning bg-warning bg-opacity-10 border-warning border-opacity-25 text-warning py-2 small rounded-3 mb-4">
            Your account is currently suspended.
        </div>

        <a href="/oauth2/authorization/google" class="btn btn-google w-100 rounded-pill py-3 d-flex justify-content-center align-items-center gap-2 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-google text-danger" viewBox="0 0 16 16">
                <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z"/>
            </svg>
            Continue with KDG Account
        </a>

        <div class="mt-2">
            <a href="/" class="text-muted text-decoration-none small hover-scale d-inline-block">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </div>
</div>

</body>
</html>
